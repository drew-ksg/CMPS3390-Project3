{% extends "base.html" %}

{% block title %}Login — Stock Tracker{% endblock %}

{% block content %}
<div class="flex justify-center items-center min-h-[70vh]">
    <div class="w-full max-w-md bg-primary p-8 rounded-lg shadow-lg border border-gray-700">

        <h2 class="text-2xl font-bold text-accent text-center mb-6">
            Login to Your Account
        </h2>

        <form id="loginForm" class="space-y-4">

            <!-- Username -->
            <div>
                <label for="username" class="block text-gray-300 mb-1">Username</label>
                <input type="text" name="username" id="username" required
                       class="w-full px-4 py-2 bg-secondary text-gray-200 rounded focus:outline-none focus:ring-2 focus:ring-accent">
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-gray-300 mb-1">Password</label>
                <input type="password" name="password" id="password" required
                       class="w-full px-4 py-2 bg-secondary text-gray-200 rounded focus:outline-none focus:ring-2 focus:ring-accent">
            </div>

            <!-- Submit Button -->
            <button type="submit"
                    class="w-full py-2 mt-4 bg-accent text-black font-bold rounded hover:bg-green-600 transition-colors">
                Login
            </button>

        </form>

        <!-- Optional links -->
        <p class="mt-6 text-center text-gray-400 text-sm">
            Don't have an account? 
            <a href="/register" class="text-accent hover:text-green-400">Register here</a>
        </p>

    </div>
</div>
{% endblock %}
{% block scripts %}
<script src="/static/js/login.js"></script>
{% endblock %}
